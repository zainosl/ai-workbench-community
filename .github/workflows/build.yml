name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Verify generic templates
        run: swift run AIWorkbenchCoreSelfTest
      - name: Check setup diagnostics
        run: swift run AIWorkbenchNext --diagnose
